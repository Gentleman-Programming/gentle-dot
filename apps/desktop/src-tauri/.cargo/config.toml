# Use Apple's toolchain even when another `cc` (for example Nix GCC) comes first
# on PATH; GCC cannot link against the macOS SDK (`-liconv` is not found).
[target.aarch64-apple-darwin]
linker = "/usr/bin/cc"

[target.x86_64-apple-darwin]
linker = "/usr/bin/cc"

[env]
CC = "/usr/bin/cc"
CXX = "/usr/bin/c++"
