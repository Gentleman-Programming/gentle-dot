# Apache reverse proxy for Gentle Dot on a cPanel/WHM VPS (HTTPS vhost include).
# Replace dot.example.com and 4317 (DOT_PORT). Requires mod_proxy, mod_proxy_http,
# mod_proxy_wstunnel, and mod_rewrite (enabled by default in EasyApache 4).
<IfModule mod_proxy.c>
	ProxyPreserveHost On
	ProxyRequests Off

	<Location />
		AuthType Basic
		AuthName "Gentle Dot"
		AuthUserFile /etc/apache2/gentle-dot.htpasswd
		Require valid-user
	</Location>

	RewriteEngine On
	RewriteCond %{HTTP:Upgrade} =websocket [NC]
	RewriteRule ^/ws$ ws://127.0.0.1:4317/ws [P,L]

	ProxyPass /ws ws://127.0.0.1:4317/ws
	ProxyPass / http://127.0.0.1:4317/
	ProxyPassReverse / http://127.0.0.1:4317/
</IfModule>
