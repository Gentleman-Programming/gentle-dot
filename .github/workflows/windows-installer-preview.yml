name: Windows installer prerelease
on:
  workflow_dispatch:
  push:
    branches:
      - 'qa/windows-installer-preview/**'
permissions:
  contents: read
concurrency:
  group: windows-installer-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    if: github.repository == 'Gentleman-Programming/gentle-dot'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Workflow and publication source contracts
        run: node --test scripts/package/test/windows-preview-release.test.mjs scripts/package/test/ci-workflow.test.mjs
      - name: Inert startup contracts including opt-in diagnostics
        run: |
          $env:GENTLE_DOT_CI_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'retained-startup-contracts'
          New-Item -ItemType Directory -Path $env:GENTLE_DOT_CI_TEST_ROOT | Out-Null
          $env:GENTLE_DOT_TEST_PWSH = (Get-Command pwsh.exe).Source
          node --test scripts/windows/test/daemon-startup.test.mjs scripts/windows/test/staged-desktop-startup.test.mjs scripts/windows/test/smoke-diagnostics.test.mjs
      - name: Inert managed admission contracts
        run: node --test scripts/windows/test/managed-admission.test.mjs
  build:
    outputs:
      runtime-sha256: ${{ steps.archive.outputs.sha256 }}
      desktop-sha256: ${{ steps.desktop.outputs.sha256 }}
    if: github.repository == 'Gentleman-Programming/gentle-dot'
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          architecture: x64
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          architecture: x64
          cache: false
      - name: Native x64 toolchain and target plan
        run: |
          rustup set default-host x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust host selection failed' }
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }
          $hostInfo = rustc -vV
          if ($LASTEXITCODE -ne 0 -or $hostInfo -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Native x64 Rust is required' }
          node scripts/package/ci-native.mjs plan --target windows-x64 --source $env:GITHUB_SHA > "$env:RUNNER_TEMP/native-plan.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native target plan failed' }
      - name: Frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      # Same public-input recipe as windows.yml; never weaken the runtime's addon guard.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - name: Build required Windows native addon
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p process.version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'v24.14.1') { throw 'Unexpected Node version for native addon' }
          $inputs = Join-Path $env:RUNNER_TEMP 'node-addon-inputs'
          New-Item -ItemType Directory -Path $inputs | Out-Null
          $release = "https://nodejs.org/download/release/$version"
          Invoke-WebRequest "$release/node-$version-headers.tar.gz" -OutFile "$inputs/headers.tar.gz"
          Invoke-WebRequest "$release/win-x64/node.lib" -OutFile "$inputs/node.lib"
          $sums = (Invoke-WebRequest "$release/SHASUMS256.txt").Content -split '\r?\n'
          foreach ($pair in @(@("node-$version-headers.tar.gz", 'headers.tar.gz'), @('win-x64/node.lib', 'node.lib'))) {
            $lines = @($sums | Where-Object { $_ -match "^[0-9a-f]{64}\s+$([regex]::Escape($pair[0]))$" })
            if ($lines.Count -ne 1) { throw 'Expected exactly one published checksum' }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $inputs $pair[1])).Hash.ToLowerInvariant()
            if ($actual -ne ($lines[0] -split '\s+')[0]) { throw "Checksum mismatch for $($pair[0])" }
          }
          tar -xf "$inputs/headers.tar.gz" -C $inputs
          if ($LASTEXITCODE -ne 0) { throw 'Node header extraction failed' }
          $compiler = (Get-Command cl.exe).Source
          pnpm --filter @gentle-dot/daemon run build:windows-stop -- --compiler "$compiler" --headers "$inputs/node-$version/include/node" --node-lib "$inputs/node.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Native addon build failed' }
          node -e "require('./packages/daemon/native/windows-stop.node')"
          if ($LASTEXITCODE -ne 0) { throw 'Native addon load failed' }
      - name: Build existing guarded Windows producer
        run: ./scripts/windows/package.ps1 -Target windows-x64
      - name: Collect exact QA payload before acceptance checks
        id: collect
        run: node scripts/package/ci-native.mjs collect --target windows-x64 --source $env:GITHUB_SHA --out build/windows-preview
      - name: Retain QA payload even when a later check fails
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-preview
          path: build/windows-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Archive only the staged product runtime for isolated checks
        id: archive
        run: |
          tar -cf "$env:RUNNER_TEMP/windows-runtime.tar" -C build/windows runtime
          if ($LASTEXITCODE -ne 0) { throw 'Staged runtime archive failed' }
          $hash = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/windows-runtime.tar").Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-runtime
          path: ${{ runner.temp }}/windows-runtime.tar
          if-no-files-found: error
          retention-days: 14
      - name: Hash the exact desktop built with this runtime
        id: desktop
        run: |
          $desktop = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/gentle-dot.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $desktop -ErrorAction Stop).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-desktop
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/gentle-dot.exe
          if-no-files-found: error
          retention-days: 14
      - name: Diagnose checkout Windows managed admission (non-gating)
        id: managed-admission
        timeout-minutes: 15
        continue-on-error: true
        run: ./scripts/windows/test/run-managed-admission.ps1
      - name: Summarize managed admission diagnostic
        if: ${{ !cancelled() && steps.managed-admission.outcome != 'skipped' }}
        env:
          ADMISSION_RESULT: ${{ steps.managed-admission.outputs.result }}
        run: |
          $result = if ($env:ADMISSION_RESULT) { $env:ADMISSION_RESULT } else { 'not-completed' }
          "Windows managed admission diagnostic: **$result** (not an acceptance gate)." >> $env:GITHUB_STEP_SUMMARY
  checks:
    name: Check ${{ matrix.kind }}
    needs: [contracts, build]
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kind: [startup, lifecycle]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-preview
          path: build/windows-preview
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview-runtime
          path: build/runtime-transfer
      - name: Verify and restore this build runtime
        env:
          RUNTIME_SHA256: ${{ needs.build.outputs.runtime-sha256 }}
        run: |
          $archive = 'build/runtime-transfer/windows-runtime.tar'
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($env:RUNTIME_SHA256 -cnotmatch '^[a-f0-9]{64}$' -or $hash -cne $env:RUNTIME_SHA256) { throw 'Runtime archive identity mismatch' }
          node scripts/package/windows-preview-release.mjs build/windows-preview $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'QA payload identity mismatch' }
          New-Item -ItemType Directory -Path build/windows -Force | Out-Null
          tar -xf $archive -C build/windows
          if ($LASTEXITCODE -ne 0) { throw 'Runtime restore failed' }
          node scripts/windows/runtime-integrity.mjs verify build/windows/runtime build/windows-preview/runtime-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Restored runtime integrity mismatch' }
      - uses: actions/download-artifact@v4
        if: matrix.kind == 'startup'
        with:
          name: windows-preview-desktop
          path: build/desktop-transfer
      - name: Packaged Node preflight and staged native desktop startup contract
        if: matrix.kind == 'startup'
        env:
          DESKTOP_SHA256: ${{ needs.build.outputs.desktop-sha256 }}
        run: ./scripts/windows/test-staged-desktop-startup.ps1 -Runtime "./build/windows/runtime" -Desktop "./build/desktop-transfer/gentle-dot.exe" -DesktopSha256 $env:DESKTOP_SHA256 -DiagnosticsPath "$env:RUNNER_TEMP/startup-diagnostics.json"
      - name: Isolated install, readiness, reinstall and uninstall
        if: matrix.kind == 'lifecycle'
        env:
          GENTLE_DOT_CI_SMOKE_PHASE: '1'
        run: |
          $installers = @(Get-ChildItem -LiteralPath build/windows-preview -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one source-bound NSIS installer' }
          ./scripts/windows/smoke-install.ps1 -Installer $installers[0].FullName -DiagnosticsPath "$env:RUNNER_TEMP/lifecycle-diagnostics.json"
      - name: Retain only sanitized acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-${{ matrix.kind }}-diagnostics
          path: |
            ${{ runner.temp }}/startup-diagnostics.json
            ${{ runner.temp }}/lifecycle-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: [contracts, build, checks]
    if: success() && github.repository == 'Gentleman-Programming/gentle-dot'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-preview
          path: build/windows-preview
      - name: Verify every published byte against source-bound QA identities
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/package/windows-preview-release.mjs build/windows-preview "$SOURCE_SHA"
      - name: Publish testing prerelease, never latest stable
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="windows-preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cat > "$RUNNER_TEMP/preview-notes.md" <<EOF
          Windows x64 installer for manual testing. NOT a stable release.
          Source: $SOURCE_SHA
          CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Packaged daemon startup and isolated installer lifecycle checks passed in CI.
          Manual acceptance on the recipient's machine remains pending.
          No publisher signature is asserted; Windows may show security warnings.
          Runtime dependency resolution is not fully frozen; see QA-MANIFEST.json.
          This prerelease does not appear on the stable public download page.
          EOF
          gh release create "$TAG" build/windows-preview/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --latest=false --title "Windows x64 installer preview #$GITHUB_RUN_NUMBER" --notes-file "$RUNNER_TEMP/preview-notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
