# Temporary T21 / S8 diagnostic: odd/tasks/windows-installer-preview-release.md L53.
name: Windows storage diagnostic 44794993333
on:
  push:
    branches:
      - 'qa/windows-storage-diagnostic-44794993333'
permissions:
  actions: read
  contents: read
jobs:
  checks:
    if: github.repository == 'Gentleman-Programming/gentle-dot' && github.ref == 'refs/heads/qa/windows-storage-diagnostic-44794993333'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Acquire and authenticate the two pinned original archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failure = 'artifact-acquisition-failed'
          try {
            # PowerShell 7.4+ preserves native stdout bytes when redirecting to a file.
            if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'binary-redirection' }
            $root = Join-Path $env:RUNNER_TEMP 'windows-storage-diagnostic-44794993333'
            New-Item -ItemType Directory -Path $root | Out-Null
            $origin = '/repos/Gentleman-Programming/gentle-dot/actions'
            $runId = 44794993333
            $source = '266ad28490e6dfeb5503400beea9dc2c565b333f'
            function Get-GitHubMetadata([string]$endpoint) {
              $response = gh api --hostname github.com $endpoint 2>$null
              if ($LASTEXITCODE -ne 0) { throw 'metadata' }
              return ($response | ConvertFrom-Json)
            }
            $failure = 'producer-identity-failed'
            $run = Get-GitHubMetadata "$origin/runs/$runId"
            if ($run.id -ne $runId -or $run.head_sha -cne $source -or $run.status -cne 'completed' -or
                $run.event -cne 'push' -or $run.path -cne '.github/workflows/windows-installer-preview.yml' -or
                $run.repository.full_name -cne 'Gentleman-Programming/gentle-dot' -or $run.repository.private -ne $false -or
                $run.repository.id -le 0 -or $run.head_repository.id -ne $run.repository.id -or $run.run_attempt -lt 1) { throw 'run' }
            $jobs = Get-GitHubMetadata "$origin/runs/$runId/attempts/$($run.run_attempt)/jobs"
            $build = @($jobs.jobs | Where-Object { $_.name -ceq 'build' })
            if ($build.Count -ne 1 -or $build[0].run_id -ne $runId -or $build[0].head_sha -cne $source -or
                $build[0].status -cne 'completed' -or $build[0].conclusion -cne 'success') { throw 'build' }
            foreach ($name in @('Build existing guarded Windows producer', 'Collect exact QA payload before acceptance checks', 'Archive only the staged product runtime for isolated checks')) {
              $step = @($build[0].steps | Where-Object { $_.name -ceq $name -and $_.conclusion -ceq 'success' })
              if ($step.Count -ne 1) { throw 'build-step' }
            }
            $artifacts = @(
              @{ Id = 14659228446; Name = 'windows-preview-runtime'; Hash = '74dfbd3bc141eadc0d01ef2e4ea5fd645c60b4a3f5caaa05a8796435a6e851cf' }
              @{ Id = 14659433165; Name = 'windows-installer-preview'; Hash = '93d3199024ad5f465d3f9f5649698517955b01d3721e4c1a1e2c3f4f6e764aee' }
            )
            foreach ($artifact in $artifacts) {
              $failure = 'artifact-identity-failed'
              $endpoint = "$origin/artifacts/$($artifact.Id)"
              $metadata = Get-GitHubMetadata $endpoint
              if ($metadata.id -ne $artifact.Id -or $metadata.name -cne $artifact.Name -or
                  $metadata.expired -ne $false -or [datetimeoffset]$metadata.expires_at -le [datetimeoffset]::UtcNow -or
                  $metadata.workflow_run.id -ne $runId -or $metadata.workflow_run.head_sha -cne $source -or
                  $metadata.workflow_run.head_branch -cne $run.head_branch -or
                  $metadata.workflow_run.repository_id -ne $run.repository.id -or
                  $metadata.workflow_run.head_repository_id -ne $run.repository.id -or
                  $metadata.digest -cne "sha256:$($artifact.Hash)") { throw 'artifact' }
              $failure = 'artifact-download-failed'
              $zip = Join-Path $root "$($artifact.Name).zip"
              gh api --hostname github.com "$endpoint/zip" > $zip 2>$null
              if ($LASTEXITCODE -ne 0) { throw 'download' }
              $failure = 'artifact-digest-failed'
              if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant() -cne $artifact.Hash) { throw 'digest' }
            }
          } catch { throw $failure }
      - name: Verify original QA payload and restored runtime inventory
        run: |
          $ErrorActionPreference = 'Stop'
          $failure = 'artifact-unpack-failed'
          try {
            $root = Join-Path $env:RUNNER_TEMP 'windows-storage-diagnostic-44794993333'
            $qa = Join-Path $root 'qa'
            $transfer = Join-Path $root 'transfer'
            Expand-Archive -LiteralPath (Join-Path $root 'windows-installer-preview.zip') -DestinationPath $qa
            Expand-Archive -LiteralPath (Join-Path $root 'windows-preview-runtime.zip') -DestinationPath $transfer
            $failure = 'qa-payload-identity-failed'
            # The hosted tooling Node verifies bytes; it does not load the runtime or installer.
            node scripts/package/windows-preview-release.mjs $qa '266ad28490e6dfeb5503400beea9dc2c565b333f' >$null 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'qa' }
            $failure = 'runtime-restore-failed'
            tar -xf (Join-Path $transfer 'windows-runtime.tar') -C $root >$null 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'restore' }
            $failure = 'runtime-inventory-failed'
            node scripts/windows/runtime-integrity.mjs verify (Join-Path $root 'runtime') (Join-Path $qa 'runtime-manifest.json') >$null 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'inventory' }
          } catch { throw $failure }
      - name: Diagnose exact packaged storage; not installer acceptance
        timeout-minutes: 2
        run: ./scripts/windows/test/run-packaged-storage-admission.ps1
