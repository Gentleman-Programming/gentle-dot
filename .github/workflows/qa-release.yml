name: Publish QA preview
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.ref == 'refs/heads/qa/native-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.gate.outputs.windows }}
      packages: ${{ steps.gate.outputs.packages }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in windows macos native-packages; do
            run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow.yml/runs" -f branch=qa/native-preview -f head_sha="$GITHUB_SHA" -f event=push --jq '.workflow_runs[0] | [.id,.conclusion] | @tsv')
            if [[ "$run" != *$'\t'success ]]; then
              echo "::error::$workflow has no successful push run on qa/native-preview for $GITHUB_SHA. Wait for the exact candidate to pass before dispatching again."
              exit 1
            fi
            case "$workflow" in
              windows) echo "windows=${run%%$'\t'*}" >> "$GITHUB_OUTPUT" ;;
              native-packages) echo "packages=${run%%$'\t'*}" >> "$GITHUB_OUTPUT" ;;
            esac
          done
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          WIN: ${{ needs.verify.outputs.windows }}
          PKG: ${{ needs.verify.outputs.packages }}
        run: |
          set -euo pipefail
          mkdir assets
          gh run download "$WIN" -n Gentle-Dot-Preview-Windows-x64 -D windows
          node scripts/package/verify-qa-manifest.mjs windows SHA256SUMS.txt Gentle-Dot-Preview-x64.zip
          (cd windows && sha256sum --strict -c SHA256SUMS.txt)
          cp windows/Gentle-Dot-Preview-x64.zip assets/
          digest=$(sha256sum assets/Gentle-Dot-Preview-x64.zip)
          digest=${digest%% *}
          node scripts/package/render-qa-launcher.mjs "$GITHUB_REPOSITORY" "$digest" > assets/Gentle-Dot-QA.cmd
          for name in linux-amd64 linux-arm64 darwin-arm64 darwin-x64; do
            gh run download "$PKG" -n "$name-qa" -D "$name"
            node scripts/package/verify-qa-manifest.mjs "$name" SHA256SUMS
            (cd "$name" && sha256sum --strict -c SHA256SUMS)
            (cd "$name" && zip -qr "../assets/$name.zip" .)
          done
          (cd assets && sha256sum * > SHA256SUMS.txt)
          tag="qa-preview-${GITHUB_SHA:0:12}"
          gh release create "$tag" assets/* --target "$GITHUB_SHA" --prerelease --latest=false --title "Gentle Dot QA ${GITHUB_SHA:0:12}" --notes "Portable Windows x64 preview with update launcher, macOS Intel and Apple Silicon, and Linux x64 and ARM64. QA commit $GITHUB_SHA."
