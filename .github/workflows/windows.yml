# The Windows verification channel (odd/tasks/windows-port.md, W3).
#
# The desktop shell is developed on macOS and Linux, where `cfg!(target_os = "windows")`
# never compiles. This workflow is the only place a Windows build is ever exercised, so a
# change that only touches a Windows arm still has to face a real `x86_64-pc-windows-msvc`
# toolchain and the real WebView2 before it can be called done.
#
# Scope note: this workflow covers Windows only. The macOS and Linux checks are still the
# commands in the README (`pnpm typecheck && pnpm lint && pnpm test`, plus `cargo test` in
# apps/desktop/src-tauri) run on a developer machine; broadening CI to those platforms is a
# separate decision, not part of the Windows port.
name: Windows

on:
  push:
    # `main` is the branch this workflow guards. `feat/windows-port` is listed while the staged port
    # lives there, because its own pushes would otherwise never run the suite they change (W27); the
    # line goes away with the branch when the port merges.
    branches: [main, feat/windows-port]
  pull_request:
  workflow_dispatch:

# A superseded push does not need to finish: the newer commit is what matters.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # `always` keeps cargo's diagnostics colored, so a failure in the Windows job is readable in the log.
  CARGO_TERM_COLOR: always

jobs:
  # The daemon, the protocol, and the UI. These are platform-neutral, so this job passes on Windows:
  # the POSIX assumptions W4 and W5 removed are gone, and the suites whose *subject* Windows does not
  # have -- the inherited fd 3, and server mode's setuid -- skip with a named reason on raw stderr
  # instead of failing (W27, `packages/daemon/test/support/platform-absence.ts`). The job is blocking,
  # so a new failure in it is a real one.
  typescript:
    name: TypeScript (daemon, protocol, UI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # No `version` input: package.json declares `packageManager: pnpm@11.5.0`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Not a convenience: `pnpm install` cannot succeed on Windows without it. The
      # gentle-pi postinstall builds its package-local Gentle AI binary **from source** on
      # Windows and requires Go 1.25.10 or newer, while the windows-latest image ships Go
      # 1.24.13. On Darwin and Linux the same postinstall downloads a pinned release archive,
      # so this requirement only shows up here. `stable` is the honest range: the constraint is
      # "or newer", not an exact version.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # The shell compiles and passes on Windows, so this job is blocking: measured on a
  # `windows-latest` runner at `e12d300`, `cargo test` reports `406 passed; 0 failed; 4 ignored`
  # (2026-10-18, run 39101716169), the same suite a Windows 11 host reports.
  #
  # It installs no node and no PATH of its own: `build.rs` records the node and PATH it finds at
  # build time, and `cargo test` never consults them, so a setup step for either would only make
  # the job look broader than it is.
  #
  # Its history is why the flag was worth stating rather than deleting quietly. It ran with
  # `continue-on-error` while `src/daemon.rs` and `src/app_channel.rs` used `std::os::unix` and
  # `std::os::fd` unconditionally, first because `tauri-build` needs `icons/icon.ico` (W8) and then
  # on 57 compile errors in its own sources (W6). W6 gated the production surface, W6c the test
  # surface, and W7 replaced the fd-3 channel with a named pipe, so the condition the old comment
  # named is now met on the runner instead of predicted from a developer machine (W27).
  rust:
    name: Rust shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      # WebView2 ships with the windows-latest image, so no extra setup step is needed for it.
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  app-channel:
    name: Native app channel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # gentle-pi's Windows postinstall requires local Go 1.25.10 or newer.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: pnpm install --frozen-lockfile

      # The build takes an explicit cl.exe path and needs the SDK's INCLUDE and LIB.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # Provision inputs here, not in the build script; match the running Node exactly.
      - name: Build app-channel addon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p process.version
          $inputs = Join-Path $env:RUNNER_TEMP 'node-addon-inputs'
          New-Item -ItemType Directory -Force -Path $inputs | Out-Null
          $release = "https://nodejs.org/download/release/$version"
          Invoke-WebRequest "$release/node-$version-headers.tar.gz" -OutFile "$inputs/headers.tar.gz"
          Invoke-WebRequest "$release/win-x64/node.lib" -OutFile "$inputs/node.lib"
          # Both downloads must match the release's published SHA-256 sums.
          $sums = (Invoke-WebRequest "$release/SHASUMS256.txt").Content -split "`n"
          foreach ($pair in @(@("node-$version-headers.tar.gz", 'headers.tar.gz'), @('win-x64/node.lib', 'node.lib'))) {
            $line = $sums | Where-Object { $_ -match "^[0-9a-f]{64}\s+$([regex]::Escape($pair[0]))$" }
            if (-not $line) { throw "No published checksum for $($pair[0])" }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $inputs $pair[1])).Hash.ToLowerInvariant()
            if ($actual -ne ($line -split '\s+')[0]) { throw "Checksum mismatch for $($pair[0])" }
          }
          tar -xf "$inputs/headers.tar.gz" -C $inputs
          if ($LASTEXITCODE -ne 0) { throw 'Node header extraction failed' }
          $compiler = (Get-Command cl.exe).Source
          pnpm --filter @gentle-dot/daemon run build:windows-stop -- --compiler "$compiler" --headers "$inputs/node-$version/include/node" --node-lib "$inputs/node.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Native addon build failed' }

      # These portable adapter tests and real-addon refusal tests stay together.
      - name: App-channel tests
        run: pnpm exec vitest run packages/daemon/test/windows-stop.test.ts packages/daemon/test/windows-app-channel.test.ts packages/daemon/test/app-channel-platform.test.ts packages/daemon/test/app-channel.test.ts packages/daemon/test/app-channel-fd.test.ts packages/daemon/test/windows-app-channel-addon.test.ts
