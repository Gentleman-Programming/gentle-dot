name: macOS QA installer

on:
  push:
    branches: ['ci/macos-distribution']
    tags: ['macos-qa-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-qa-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GENTLE_DOT_UPDATE_REPOSITORY: ${{ github.repository }}
      GENTLE_DOT_UPDATE_PUBLIC_KEY: ${{ vars.GENTLE_DOT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        # Reads the exact version from package.json.
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Verify Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          xcode-select -p
          rustc --version
          node --version
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Packaging tests
        run: pnpm exec vitest run scripts/package/test/lib.test.ts scripts/package/test/package-mac.test.ts scripts/package/test/update-distribution.test.ts
      - name: Build UI
        run: pnpm build
      - name: Check Rust and run library tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo check --locked --all-targets
          cargo test --locked --lib
      - name: Build and smoke-test the actual DMG (no release secrets)
        if: github.ref_type != 'tag'
        run: pnpm package:mac --check
      - name: Build signed QA update and smoke-test DMG
        if: github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$GENTLE_DOT_UPDATE_PUBLIC_KEY"
          pnpm package:mac --check
      - name: Collect verified installer and provenance
        run: node scripts/package/collect-macos-qa.mjs
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gentle-dot-macos-arm64-${{ github.sha }}
          path: dist/macos-qa/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    if: (github.repository == 'Maicololiveras/gentle-dot' || github.repository == 'Gentleman-Programming/gentle-dot') && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/macos-qa-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gentle-dot-macos-arm64-${{ github.sha }}
          path: dist
      - name: Verify artifact hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create QA draft without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^macos-qa-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$RELEASE_REPO" --verify-tag --draft --prerelease \
            --title "Gentle Dot macOS QA — $RELEASE_TAG" \
            --notes 'Community fork build for Apple Silicon. Ad-hoc signed, not notarized by Apple. Includes SHA256SUMS, upstream license and BUILD-INFO.json. Review the DMG on a real Mac before publishing. See docs/fork/MACOS-GETTING-STARTED.md at the release commit.'
