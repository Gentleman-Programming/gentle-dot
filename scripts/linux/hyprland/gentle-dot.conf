# Gentle Dot on Hyprland with a classic hyprland.conf (Hyprland before the Lua config).
# Hyprland does not let apps place their own windows or stay on top, so these rules do it:
# the rose floats at the right edge on every workspace, and the panel opens next to it.
# Paste this at the end of ~/.config/hypr/hyprland.conf, or copy the file to
# ~/.config/hypr/gentle-dot.conf and add `source = ~/.config/hypr/gentle-dot.conf`.
# Using hyprland.lua (Omarchy 4)? See gentle-dot.lua next to this file.
# Check your version with `hyprctl version`, then keep only the block for it.

# --- Hyprland 0.53 and 0.54 ---
windowrule = match:title ^(Gentle Dot)$, float on, pin on, size 72 72, move (monitor_w-window_w-12) ((monitor_h-window_h)*0.5), border_size 0, rounding 0, no_shadow on, no_blur on, no_initial_focus on, opacity 1 override 1 override
windowrule = match:title ^(Gentle Dot Panel)$, float on, pin on, size 420 640, move (monitor_w-window_w-92) ((monitor_h-window_h)*0.5), border_size 0, no_shadow on, no_blur on, opacity 1 override 1 override

# --- Hyprland 0.48 to 0.52: comment out the two lines above and use these instead.
# --- Before 0.48, write windowrulev2 instead of windowrule.
# windowrule = float, pin, size 72 72, move 100%-w-12 50%, noborder, rounding 0, noshadow, noblur, noinitialfocus, opacity 1 override 1 override, title:^(Gentle Dot)$
# windowrule = float, pin, size 420 640, move 100%-w-92 10%, noborder, noshadow, noblur, opacity 1 override 1 override, title:^(Gentle Dot Panel)$

# --- Every version: SUPER + ALT + D toggles the panel.
bind = SUPER ALT, D, exec, ~/.local/bin/gentle-dot --toggle
